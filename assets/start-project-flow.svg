<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 680" role="img" aria-label="Is this a project workflow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7f2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f16619"/>
      <stop offset="1" stop-color="#d2470d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".10"/>
    </filter>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#4b5057"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#d2470d"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1304" height="664" rx="24" fill="url(#bg)" stroke="#eee5dd" stroke-width="2"/>

  <text x="660" y="70" text-anchor="middle" font-family="Segoe UI, Arial" font-size="44" font-weight="700" fill="#121922">Is this a project?</text>
  <text x="660" y="112" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" fill="#3a3f45">Use this quick test before submitting a new project proposal. If most answers are yes, treat it as a project.</text>

  <g filter="url(#shadow)">
    <circle cx="120" cy="328" r="62" fill="#ffffff" stroke="#ddd6cf" stroke-width="3"/>
    <text x="120" y="314" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" fill="#d2470d">!</text>
    <text x="120" y="358" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#20242a">New idea</text>
  </g>

  <path d="M190 328H250" stroke="#4b5057" stroke-width="4" marker-end="url(#arrowDark)"/>

  <g filter="url(#shadow)">
    <rect x="264" y="168" width="360" height="320" rx="18" fill="#ffffff" stroke="#e4ddd7" stroke-width="2"/>
    <circle cx="316" cy="220" r="28" fill="url(#orange)"/>
    <rect x="304" y="205" width="24" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M310 205v-7h12v7M310 222l6 6 11-15" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="360" y="232" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#121922">Project test</text>

    <g font-family="Segoe UI, Arial" fill="#20242a">
      <circle cx="310" cy="284" r="16" fill="url(#orange)"/>
      <text x="310" y="291" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
      <text x="342" y="291" font-size="18">Clear goal</text>
      <line x1="300" y1="314" x2="590" y2="314" stroke="#eee7e1" stroke-width="2"/>

      <circle cx="310" cy="342" r="16" fill="url(#orange)"/>
      <text x="310" y="349" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
      <text x="342" y="349" font-size="18">Clear end point</text>
      <line x1="300" y1="372" x2="590" y2="372" stroke="#eee7e1" stroke-width="2"/>

      <circle cx="310" cy="400" r="16" fill="url(#orange)"/>
      <text x="310" y="407" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
      <text x="342" y="407" font-size="18">More than one person or team</text>
      <line x1="300" y1="430" x2="590" y2="430" stroke="#eee7e1" stroke-width="2"/>

      <circle cx="310" cy="458" r="16" fill="url(#orange)"/>
      <text x="310" y="465" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">4</text>
      <text x="342" y="458" font-size="18">Changes people, systems,</text>
      <text x="342" y="482" font-size="18">or processes</text>
      <line x1="300" y1="506" x2="590" y2="506" stroke="#eee7e1" stroke-width="2"/>

      <circle cx="310" cy="534" r="16" fill="url(#orange)"/>
      <text x="310" y="541" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">5</text>
      <text x="342" y="534" font-size="18">Risk, cost, compliance,</text>
      <text x="342" y="558" font-size="18">or stakeholder impact</text>
    </g>
  </g>

  <path d="M624 328H716" stroke="#4b5057" stroke-width="4" marker-end="url(#arrowDark)"/>

  <g filter="url(#shadow)">
    <path d="M832 200L960 328L832 456L704 328Z" fill="url(#orange)"/>
    <circle cx="832" cy="278" r="28" fill="none" stroke="#ffffff" stroke-width="5"/>
    <text x="832" y="288" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" fill="#ffffff">?</text>
    <text x="832" y="352" text-anchor="middle" font-family="Segoe UI, Arial" font-size="30" font-weight="700" fill="#ffffff">Mostly yes?</text>
  </g>

  <path d="M832 456V494" stroke="#d2470d" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="852" y="486" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#d2470d">Yes</text>

  <g filter="url(#shadow)">
    <rect x="650" y="505" width="364" height="80" rx="14" fill="url(#orange)"/>
    <circle cx="696" cy="545" r="24" fill="#ffffff"/>
    <path d="M684 545l9 9 18-22" fill="none" stroke="#d2470d" stroke-width="5"/>
    <text x="730" y="538" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#ffffff">Treat it as a project</text>
    <text x="730" y="568" font-family="Segoe UI, Arial" font-size="17" fill="#ffffff">Name the sponsor and project manager.</text>
  </g>

  <path d="M960 328H1114" stroke="#4b5057" stroke-width="4" marker-end="url(#arrowDark)"/>
  <text x="1036" y="306" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#4b5057">No</text>

  <g filter="url(#shadow)">
    <rect x="1120" y="250" width="160" height="156" rx="16" fill="#ffffff" stroke="#e4ddd7" stroke-width="2"/>
    <circle cx="1160" cy="300" r="24" fill="#a7a4a1"/>
    <path d="M1148 288l24 24M1172 288l-24 24" stroke="#ffffff" stroke-width="5"/>
    <text x="1194" y="309" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#242a31">Not a project</text>
    <text x="1146" y="354" font-family="Segoe UI, Arial" font-size="16" fill="#3a3f45">Keep it with the</text>
    <text x="1146" y="376" font-family="Segoe UI, Arial" font-size="16" fill="#3a3f45">owning team.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="590" width="364" height="54" rx="12" fill="#ffffff" stroke="#d2470d" stroke-width="3"/>
    <rect x="680" y="606" width="22" height="26" rx="3" fill="none" stroke="#d2470d" stroke-width="3"/>
    <path d="M686 617h10M686 624h8" stroke="#d2470d" stroke-width="2"/>
    <text x="722" y="624" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#d2470d">Open new project proposal form</text>
  </g>
</svg>
